<nav class="navbar">
  <div class="navbar-content d-flex justify-content-between w-100">
    
    <!-- Logo and Brand -->
    <div class="navbar-brand">
      <a routerLink="/" class="logo-link">
        <img src="assets/logo-trendstarz-logo-text.png" alt="TrendStarz" class="logo-image" />
      </a>
    </div>

    <!-- Navigation Tabs -->
    <div class="navbar-tabs">
      <a routerLink="/search" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-tab">
        Search
      </a>
      <a routerLink="/campaigns" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" *ngIf="user?.role === 'brand' || user?.role === 'influencer'" class="nav-tab">
        Campaigns
      </a>
      <a routerLink="/how-it-works" routerLinkActive="active" class="nav-tab">
        How it Works
      </a>
      <a routerLink="/register-influencer" routerLinkActive="active" *ngIf="!user" class="nav-tab">
        Register as Influencer
      </a>
      <a routerLink="/register-brand" routerLinkActive="active" *ngIf="!user" class="nav-tab">
        Register as Brand
      </a>
    </div>

    <!-- Search and Icons -->
    <div class="navbar-actions">
      <!-- Icons -->
      <div class="navbar-icons">
        <!-- App Switcher Button -->
        <button class="icon-btn app-switcher-btn" title="Settings" *ngIf="!user">
          <i class="bi bi-gear"></i>
        </button>

        <!-- Login Button (when not logged in) -->
        <a routerLink="/login" class="btn btn-sm btn-login" *ngIf="!user">
          Login
        </a>

        <!-- Profile Dropdown (when logged in) -->
        <div class="profile-dropdown" *ngIf="user">
          <button class="profile-btn" data-bs-toggle="dropdown" aria-expanded="false">
            <img [src]="validProfileImage || 'assets/logo-trendstarz-logo.png'" 
                 [alt]="user.name || user.brandName || 'User'" 
                 class="profile-avatar" />
            <span class="profile-name">
              {{ (user.name && user.name !== user.email) ? user.name : (user.brandName && user.brandName !== user.email ? user.brandName : 'User') }}
            </span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><span class="dropdown-header">{{ (user.name && user.name !== user.email) ? user.name : (user.brandName && user.brandName !== user.email ? user.brandName : user.email) }}</span></li>
            <li><hr class="dropdown-divider"></li>
            <li *ngIf="user?.role === 'influencer'"><a class="dropdown-item" routerLink="/influencer-profile">Profile</a></li>
            <li *ngIf="user?.role === 'brand'"><a class="dropdown-item" routerLink="/brand-profile">Profile</a></li>
            <li *ngIf="user?.role === 'brand'"><a class="dropdown-item" routerLink="/campaigns">Campaigns</a></li>
            <li *ngIf="user?.role === 'admin'"><a class="dropdown-item" routerLink="/admin/deleted-users">Admin Panel</a></li>
            <li><a class="dropdown-item" routerLink="/settings">Settings</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" (click)="logout()">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>

  </div>
</nav>

<div class="content-area bg-white rounded-3 shadow-sm mx-3 py-2" style="background-color: #f5f5f7 !important;">
<router-outlet></router-outlet>
</div>

<app-footer></app-footer>
