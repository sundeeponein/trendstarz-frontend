<nav class="admin-navbar">
  <div class="navbar-content">
    <!-- Logo and Brand -->
    <div class="navbar-brand">
      <a routerLink="/admin/admin-dashboard" class="logo-link">
        <img src="assets/logo-trendstarz-logo-text.png" alt="TrendStarz" class="logo-image" />
      </a>
    </div>

    <!-- Navigation Tabs -->
    <div class="navbar-tabs">
      <a routerLink="/admin/admin-user-table" 
         routerLinkActive="active" 
         [routerLinkActiveOptions]="{ exact: false }"
         class="nav-tab">
        User Management
      </a>
      <a routerLink="/admin/deleted-users" 
         routerLinkActive="active" 
         [routerLinkActiveOptions]="{ exact: false }"
         class="nav-tab">
        Deleted Users
      </a>
      <a routerLink="/admin/payments" 
         routerLinkActive="active" 
         [routerLinkActiveOptions]="{ exact: false }"
         class="nav-tab">
        Payments
      </a>
      <a routerLink="/admin/admin-management" 
         routerLinkActive="active" 
         [routerLinkActiveOptions]="{ exact: false }"
         class="nav-tab">
        Admin Management
      </a>
    </div>

    <!-- Search and Icons -->
    <div class="navbar-actions">
      <!-- Search Bar -->
      <div class="search-container">
        <input type="text" class="search-input" placeholder="Search influencers..." />
        <i class="bi bi-search search-icon"></i>
      </div>

      <!-- Icons -->
      <div class="navbar-icons">
        <button class="icon-btn notification-btn" title="Notifications">
          <i class="bi bi-bell"></i>
        </button>
        <button class="icon-btn settings-btn" title="Settings">
          <i class="bi bi-gear"></i>
        </button>

        <!-- Profile Dropdown -->
        <div class="profile-dropdown" *ngIf="adminUser">
          <button class="profile-btn" data-bs-toggle="dropdown" aria-expanded="false">
            <img [src]="adminUser.profileImage || 'assets/default-profile.png'" 
                 [alt]="adminUser.name" 
                 class="profile-avatar" />
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><span class="dropdown-header">{{ adminUser.name }}</span></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Profile Settings</a></li>
            <li><a class="dropdown-item" href="#">Account Settings</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" (click)="logout()">Logout</a></li>
          </ul>
        </div>

        <div *ngIf="!adminUser">
          <a routerLink="/login" class="btn btn-sm btn-primary">Login</a>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="admin-container">
  <router-outlet></router-outlet>
</div>
