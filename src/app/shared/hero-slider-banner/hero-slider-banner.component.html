<section class="hero-slider-wrap" [attr.aria-label]="ariaLabel">
  <div class="container py-4 py-lg-5" *ngIf="activeSlide as slide">
    <article class="hero-slider-card">
      <div class="row g-4 align-items-center">
        <div class="col-12 col-lg-6">
          <div class="hero-slider-content">
            <p class="hero-slider-kicker">{{ badge }}</p>
            <h2 class="hero-slider-heading">{{ slide.heading }}</h2>
            <p class="hero-slider-highlight">{{ slide.highlightText }}</p>
            <p class="hero-slider-description">{{ slide.description }}</p>

            <div class="hero-slider-actions">
              <button
                type="button"
                class="btn hero-slider-btn hero-slider-btn-primary"
                (click)="go(slide.primaryRoute)">
                {{ slide.primaryLabel }}
              </button>
              <button
                type="button"
                class="btn hero-slider-btn hero-slider-btn-secondary"
                (click)="go(slide.secondaryRoute)">
                {{ slide.secondaryLabel }}
              </button>
              <button
                *ngIf="showTextLink && slide.textLinkLabel && slide.textLinkRoute"
                type="button"
                class="hero-slider-link"
                (click)="go(slide.textLinkRoute)">
                {{ slide.textLinkLabel }}
              </button>
            </div>

            <div class="hero-slider-controls" aria-label="Hero slide controls">
              <button
                type="button"
                class="hero-slider-arrow"
                aria-label="Previous slide"
                (click)="navigate('prev')">
                <span aria-hidden="true">&#8592;</span>
              </button>
              <div class="hero-slider-dots" role="tablist" aria-label="Select slide">
                <button
                  type="button"
                  *ngFor="let slideItem of slides; let i = index"
                  role="tab"
                  class="hero-slider-dot"
                  [class.active]="i === activeSlideIndex"
                  [attr.aria-selected]="i === activeSlideIndex"
                  [attr.aria-label]="'Go to slide ' + (i + 1)"
                  (click)="goToSlide(i)">
                </button>
              </div>
              <button
                type="button"
                class="hero-slider-arrow"
                aria-label="Next slide"
                (click)="navigate('next')">
                <span aria-hidden="true">&#8594;</span>
              </button>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <figure class="hero-slider-media">
            <img
              [src]="slide.imageUrl"
              [alt]="slide.imageAlt"
              [attr.loading]="activeImageLoading"
              [attr.fetchpriority]="activeImageFetchPriority"
              decoding="async"
              [style.object-position]="slide.imagePosition || 'center center'" />
            <figcaption class="hero-slider-media-caption">Slide {{ activeSlideIndex + 1 }} of {{ slides.length }}</figcaption>
          </figure>
        </div>
      </div>
    </article>
  </div>
</section>
