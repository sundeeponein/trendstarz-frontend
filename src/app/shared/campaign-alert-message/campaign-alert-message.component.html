<section class="campaign-alert-message">
  <button type="button" class="campaign-alert-message__toggle" (click)="toggleExpanded()">
    <span class="campaign-alert-message__toggle-text">
      <strong>{{ statusHeaderText }}</strong>
      <small>&bull; {{ shareSectionTitle }}</small>
    </span>
    <i class="bi" [ngClass]="expanded ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
  </button>

  <div class="campaign-alert-message__body" *ngIf="expanded">
    <p class="campaign-alert-message__help">{{ shareHelpText }}</p>

    <div class="campaign-alert-message__checks" aria-label="Campaign notification channels">
      <span class="campaign-alert-message__check" [class.is-on]="isApprovedStatus" [class.is-disabled]="!isApprovedStatus">
        In-App Notification{{ isApprovedStatus ? '' : ' (after approval)' }}
      </span>
      <span class="campaign-alert-message__check is-disabled">Email Notification (Coming Soon)</span>
      <span class="campaign-alert-message__check" [class.is-on]="isApprovedStatus" [class.is-disabled]="!isApprovedStatus">
        WhatsApp Alert {{ isApprovedStatus ? 'Ready' : '(after approval)' }}
      </span>
    </div>

    <div class="campaign-alert-message__template">
      <div class="campaign-alert-message__template-header">
        <span>{{ relevantMessageLabel }}</span>
        <button type="button" class="btn btn-primary btn-sm" (click)="copyRelevantMessage()">
          {{ copied ? 'Copied' : relevantCopyButtonLabel }}
        </button>
      </div>
      <pre>{{ relevantMessage }}</pre>
    </div>

    <!-- Applies to both invite-only and open-to-all campaigns -->
    <div class="campaign-alert-message__template">
      <div class="campaign-alert-message__template-header">
        <span>Upcoming Posting Reminder</span>
        <button type="button" class="btn btn-primary btn-sm" (click)="copyReminderMessage()">
          {{ reminderCopied ? 'Copied' : 'Copy Posting Reminder' }}
        </button>
      </div>
      <pre>{{ postingReminderMessage }}</pre>
    </div>
  </div>
</section>
