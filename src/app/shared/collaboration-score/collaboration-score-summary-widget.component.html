<div class="cssw-card">
  <span class="cssw-icon" aria-hidden="true"><i class="bi bi-graph-up-arrow"></i></span>

  <div class="cssw-body">
    <div class="cssw-kicker">TrendScore</div>

    <div class="cssw-loading" *ngIf="loading" role="status" aria-live="polite">
      <div class="spinner-border spinner-border-sm" aria-hidden="true"></div>
      <span>Loading…</span>
    </div>

    <ng-container *ngIf="!loading">
      <ng-container *ngIf="!audit">
        <p class="cssw-title">No audit yet</p>
        <p class="cssw-copy">Generate your FREE TrendScore to see how brands view your profile.</p>
      </ng-container>

      <ng-container *ngIf="audit">
        <p class="cssw-title">{{ audit.campaignReadiness }}</p>
        <p class="cssw-copy" *ngIf="lastCheckedLabel">Last checked: {{ lastCheckedLabel }}</p>
      </ng-container>
    </ng-container>
  </div>

  <ng-container *ngIf="!loading">
    <div
      *ngIf="audit"
      class="cssw-score-badge"
      [ngClass]="ui.scoreTierClass(audit.collaborationScore)"
      role="img"
      [attr.aria-label]="'TrendScore: ' + audit.collaborationScore + ' out of 100'"
    >
      {{ audit.collaborationScore }}<span class="cssw-score-max" aria-hidden="true">/100</span>
    </div>

    <button *ngIf="!audit" type="button" class="cssw-cta" [disabled]="generating" (click)="generateScore.emit()">
      {{ generating ? 'Generating…' : 'Generate FREE Score' }} <i class="bi bi-arrow-right" *ngIf="!generating"></i>
    </button>
    <a *ngIf="audit" routerLink="/dashboard/trendstarz-score" class="cssw-link">View report <i class="bi bi-arrow-right"></i></a>
  </ng-container>
</div>
