<div class="cssw-card text-black">
  <div class="cssw-header">
    <i class="bi bi-graph-up-arrow" aria-hidden="true"></i>
    TrendStarZ Score
  </div>

  <div class="cssw-loading" *ngIf="loading" role="status" aria-live="polite">
    <div class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></div>
    <span>Loading…</span>
  </div>

  <ng-container *ngIf="!loading">
    <div class="cssw-empty" *ngIf="!audit">
      <p class="cssw-empty-title">No Audit Yet</p>
      <p class="cssw-empty-copy">Generate your FREE TrendStarZ Score to see how brands view your profile.</p>
      <button type="button" class="btn btn-primary btn-sm" [disabled]="generating" (click)="generateScore.emit()">
        {{ generating ? 'Generating…' : 'Generate FREE Score' }}
      </button>
    </div>

    <div class="cssw-summary" *ngIf="audit">
      <div
        class="cssw-score-badge"
        [ngClass]="ui.scoreTierClass(audit.collaborationScore)"
        role="img"
        [attr.aria-label]="'TrendStarZ Score: ' + audit.collaborationScore + ' out of 100'"
      >
        {{ audit.collaborationScore }}<span class="cssw-score-max" aria-hidden="true">/100</span>
      </div>
      <div class="cssw-summary-meta">
        <div class="cssw-tier">{{ audit.campaignReadiness }}</div>
        <div class="cssw-last-checked" *ngIf="lastCheckedLabel">Last Checked: {{ lastCheckedLabel }}</div>
        <a routerLink="/dashboard/trendstarz-score" class="btn btn-outline-primary btn-sm mt-2">View Report</a>
      </div>
    </div>
  </ng-container>
</div>
