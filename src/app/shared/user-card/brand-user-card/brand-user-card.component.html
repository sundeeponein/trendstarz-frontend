<div class="brand-card" (click)="viewProfileClick.emit()">
  <!-- Image + overlays -->
  <div class="brand-card__img-wrap">
    <img [src]="displayBrandLogo" (error)="onImgError($event)" class="brand-card__img" />

    <!-- Admin badges on image -->
    <div class="brand-card__img-tags" *ngIf="displayTags.length">
      <span
        *ngFor="let tag of displayTags"
        class="brand-card__img-tag badge rounded-pill"
        [ngClass]="tagBadgeClass(tag)">
        {{ tag }}
      </span>
    </div>

  </div>

  <!-- Body -->
  <div class="brand-card__body">
    <!-- Name -->
    <div class="brand-card__name">
      {{ brandName }}
      <i class="bi bi-patch-check-fill brand-card__verified" *ngIf="isPremium" title="Verified"></i>
    </div>

    <!-- Categories -->
    <div class="brand-card__category">{{ categories.join(' · ') || '—' }}</div>

    <!-- Location -->
    <div class="brand-card__location" *ngIf="location?.state">
      <i class="bi bi-geo-alt"></i>
      <ng-container *ngIf="location?.district">{{ location.district }}, </ng-container>{{ location.state }}
    </div>

    <div class="brand-card__contact" *ngIf="showSocialLockHint">
      <i class="bi bi-lock-fill brand-card__contact-icon"></i>
      <span>Social profiles locked on free plan</span>
    </div>

    <div class="brand-card__meta" *ngIf="showWelcomeCampaignMeta && welcomeCampaignStatus">
      <span>{{ welcomeCampaignMetaLabel }}</span>
      <span class="brand-card__live-pill">{{ welcomeCampaignStatus }}</span>
    </div>



    <!-- Platform icons -->
    <!-- <div class="brand-card__platforms" *ngIf="socialMedia.length > 0">
      <span class="brand-card__platform-icon" *ngFor="let sm of socialMedia" [title]="sm.platform">
        <i class="bi {{ platformIcon(sm.platform) }}"></i>
      </span>
    </div> -->

    <!-- Pricing (visible to everyone) -->
    <!-- <div class="brand-card__pricing-row" *ngIf="promotionalPrice">
      <span class="brand-card__pricing-label">Starting from</span>
      <span class="brand-card__price">₹{{ promotionalPrice | number }}</span>
    </div> -->

    <!-- PRO VIEW: Contact-visible badge -->
    <!-- <div class="brand-card__contact" *ngIf="isProViewer && !contactRestricted">
      <i class="bi bi-check-circle-fill brand-card__contact-icon"></i>
      <span>Contact details visible</span>
    </div> -->

  </div>
</div>
