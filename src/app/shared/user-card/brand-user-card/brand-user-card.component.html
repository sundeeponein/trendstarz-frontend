<div class="brand-card">
  <!-- Image + heart overlay -->
  <div class="brand-card__img-wrap">
    <img [src]="displayBrandLogo" (error)="onImgError($event)" class="brand-card__img" />
    <button class="brand-card__heart" (click)="$event.stopPropagation()" title="Save">
      <i class="bi bi-heart"></i>
    </button>
    <span class="brand-card__premium" *ngIf="isPremium">★ Premium</span>
  </div>

  <!-- Body -->
  <div class="brand-card__body">
    <div class="brand-card__name">{{ brandName }}</div>
    <div class="brand-card__category">{{ categories[0] || '—' }}</div>

    <!-- Stats row -->
    <div class="brand-card__stats">
      <div class="brand-card__stat">
        <span class="brand-card__stat-label">FOLLOWERS</span>
        <span class="brand-card__stat-value">{{ formatFollowers(socialMedia[0]?.followersCount) }}</span>
      </div>
      <div class="brand-card__stat" *ngIf="location?.state">
        <span class="brand-card__stat-label">LOCATION</span>
        <span class="brand-card__stat-value">{{ location.state }}</span>
      </div>
    </div>

    <!-- Contact / Pricing row -->
    <div class="brand-card__contact" *ngIf="isProViewer">
      <i class="bi bi-check-circle-fill brand-card__contact-icon"></i>
      <span>Contact details visible</span>
    </div>
    <div class="brand-card__locked" *ngIf="!isProViewer" (click)="$event.stopPropagation()" routerLink="/brand-profile">
      <i class="bi bi-lock-fill brand-card__locked-icon"></i>
      <span>Pricing hidden — upgrade to Pro</span>
    </div>

    <!-- Buttons -->
    <div class="brand-card__actions">
      <button class="brand-card__btn brand-card__btn--outline" (click)="viewProfileClick.emit()">
        View Profile
      </button>
      <button class="brand-card__btn brand-card__btn--primary" *ngIf="showCampaignBtn" (click)="createCampaignClick.emit(); $event.stopPropagation()">
        <i class="bi bi-plus-lg"></i> Campaign
      </button>
    </div>
  </div>
</div>
