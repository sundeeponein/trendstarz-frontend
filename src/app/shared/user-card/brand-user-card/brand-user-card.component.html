<div class="brand-card" (click)="isProViewer && viewProfileClick.emit()">
  <!-- Image + heart overlay -->
  <div class="brand-card__img-wrap">
    <img [src]="displayBrandLogo" (error)="onImgError($event)" class="brand-card__img" />
    <button class="brand-card__heart" (click)="$event.stopPropagation()" title="Save">
      <i class="bi bi-heart"></i>
    </button>
    <!-- PRO badge top-left -->
    <span class="brand-card__pro-badge" *ngIf="isPremium">PRO</span>
    <!-- Priority badge top-right (premium) -->
    <span class="brand-card__priority-badge" *ngIf="isPremium">⭐ Priority</span>
  </div>

  <!-- Body -->
  <div class="brand-card__body">
    <!-- Name -->
    <div class="brand-card__name">
      {{ brandName }}
      <i class="bi bi-patch-check-fill brand-card__verified" *ngIf="isPremium" title="Verified"></i>
    </div>

    <!-- Categories -->
    <div class="brand-card__category">{{ categories.join(' · ') || '—' }}</div>

    <!-- Location -->
    <div class="brand-card__location" *ngIf="location?.state">
      <i class="bi bi-geo-alt"></i> {{ location.district }}, {{ location.state }}
    </div>

    <!-- Stats row -->
    <div class="brand-card__stats">
      <div class="brand-card__stat">
        <span class="brand-card__stat-value">{{ primaryTier || '—' }}</span>
        <span class="brand-card__stat-label">Tier</span>
      </div>
      <div class="brand-card__stat">
        <span class="brand-card__stat-value">{{ socialMedia.length }}</span>
        <span class="brand-card__stat-label">Platforms</span>
      </div>
    </div>

    <!-- Platform icons -->
    <div class="brand-card__platforms" *ngIf="socialMedia.length > 0">
      <span class="brand-card__platform-icon" *ngFor="let sm of socialMedia" [title]="sm.platform">
        <i class="bi {{ platformIcon(sm.platform) }}"></i>
      </span>
    </div>

    <!-- Pricing (visible to everyone) -->
    <div class="brand-card__pricing-row" *ngIf="promotionalPrice">
      <span class="brand-card__pricing-label">Starting from</span>
      <span class="brand-card__price">₹{{ promotionalPrice | number }}</span>
    </div>

    <!-- PRO VIEW: Contact-visible badge -->
    <div class="brand-card__contact" *ngIf="isProViewer">
      <i class="bi bi-check-circle-fill brand-card__contact-icon"></i>
      <span>Contact details visible</span>
    </div>

    <!-- Buttons -->
    <div class="brand-card__actions">
      <button class="brand-card__btn brand-card__btn--outline" (click)="viewProfileClick.emit(); $event.stopPropagation()">
        View Profile
      </button>
      <button class="brand-card__btn brand-card__btn--primary" *ngIf="showCampaignBtn" (click)="createCampaignClick.emit(); $event.stopPropagation()">
        <i class="bi bi-plus-lg"></i> Campaign
      </button>
    </div>
  </div>
</div>
