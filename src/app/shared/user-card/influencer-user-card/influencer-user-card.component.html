<div
  class="inf-card"
  [class.inf-card--locked]="profileViewDisabled"
  [attr.aria-disabled]="profileViewDisabled"
  [title]="profileViewDisabled ? 'Upgrade to Pro to open this profile' : null"
  (click)="onViewProfileClick($event)">
  <!-- Image + overlays -->
  <div class="inf-card__img-wrap">
    <img [src]="displayImage" (error)="onImgError($event)" class="inf-card__img" title="{{ name }}" />

    <!-- Trust badges -->
    <div class="inf-card__img-tags" *ngIf="isTrendstarzVerified || isPremium || (professionalStatus && visibleCreatorTypes.length)">
      <ng-container *ngIf="professionalStatus && visibleCreatorTypes.length">
        <span class="inf-card__img-tag badge rounded-pill badge--creator-type" *ngFor="let type of visibleCreatorTypes">{{ type }}</span>
      </ng-container>
      <span class="inf-card__img-tag badge rounded-pill badge--premium" *ngIf="isPremium" tooltip="Premium" title="Premium">
        <i class="bi bi-star-fill"></i>
      </span>
      <span class="inf-card__img-tag badge rounded-pill badge--recommended" *ngIf="trendstarzRecommended" title="TrendStarz Recommended">
        <i class="bi bi-award-fill"></i>
      </span>
    </div>
  </div>

  <!-- Body -->
  <div class="inf-card__body">
    <!-- Name -->
    <div class="inf-card__name">
      {{ name }} 
      <span class="text-success" *ngIf="isTrendstarzVerified" title="Verified" tooltip="Verified">
        <i class="bi bi-patch-check-fill"></i>
      </span>
    </div>

    <!-- Categories + welcome-only starting price -->
    <div class="inf-card__category-row">
      <div class="inf-card__category">{{ displayCategory }}</div>
      <div class="inf-card__welcome-price" *ngIf="showWelcomeStartingPrice && promotionalPrice" title="Automatically calculated from content rates">
        Starts from ₹{{ promotionalPrice | number:'1.0-0' }}
      </div>
    </div>

    <!-- Location -->
    <div class="inf-card__location" *ngIf="location?.state">
      <i class="bi bi-geo-alt"></i>
      <ng-container *ngIf="location?.district">{{ location.district }}, </ng-container>{{ location.state }}
    </div>

    <!-- Collaboration Score summary -->
    <div class="inf-card__score-row" *ngIf="collaborationScore != null">
      <span class="badge rounded-pill" [ngClass]="collaborationScoreUi.scoreTierClass(collaborationScore)">
        {{ collaborationScore }}
      </span>
      <span class="badge rounded-pill" *ngIf="campaignReady" [ngClass]="collaborationScoreUi.campaignReadinessClass(campaignReady)">
        {{ campaignReady }}
      </span>
      <span class="inf-card__suggested-price" *ngIf="suggestedPriceRange?.reelPrice != null">
        From ₹{{ suggestedPriceRange!.reelPrice | number:'1.0-0' }}/Reel
      </span>
    </div>

    <!-- PRO VIEW: Contact-visible badge -->
    <div class="inf-card__contact" *ngIf="isProViewer && !contactRestricted">
      <i class="bi bi-check-circle-fill inf-card__contact-icon"></i>
      <span>Contact details visible</span>
    </div>
  </div>
</div>
