<div
  class="inf-card"
  [class.inf-card--locked]="profileViewDisabled"
  [attr.aria-disabled]="profileViewDisabled"
  [title]="profileViewDisabled ? 'Upgrade to Pro to open this profile' : null"
  (click)="onViewProfileClick($event)">
  <!-- Image + overlays -->
  <div class="inf-card__img-wrap">
    <img [src]="displayImage" (error)="onImgError($event)" class="inf-card__img" title="{{ name }}" />

    <!-- Trust badges -->
    <div class="inf-card__img-tags" *ngIf="isTrendstarzVerified || isPremium">
      <span class="inf-card__img-tag badge rounded-pill badge--ts-verified" *ngIf="isTrendstarzVerified" title="Verified" tooltip="Verified">
        <i class="bi bi-patch-check-fill"></i> Verified
      </span>
      <span class="inf-card__img-tag badge rounded-pill badge--premium" *ngIf="isPremium" tooltip="Premium" title="Premium">
        <i class="bi bi-star-fill"></i> Premium
      </span>
    </div>
  </div>

  <!-- Body -->
  <div class="inf-card__body">
    <!-- Name -->
    <div class="inf-card__name">
      {{ name }}
    </div>

    <!-- Categories + welcome-only starting price -->
    <div class="inf-card__category-row">
      <div class="inf-card__category">{{ displayCategory }}</div>
      <div class="inf-card__welcome-price" *ngIf="showWelcomeStartingPrice && promotionalPrice">
        ₹{{ promotionalPrice | number:'1.0-0' }}
      </div>
    </div>

    <!-- Professional Status + Creator Type -->
    <!-- <div class="inf-card__pro-row" *ngIf="professionalStatus && visibleCreatorTypes.length">
      <span class="inf-card__pro-badge">Professional</span>
      <span class="inf-card__creator-type" *ngFor="let type of visibleCreatorTypes">{{ type }}</span>
    </div> -->

    <!-- Location -->
    <div class="inf-card__location" *ngIf="location?.state">
      <i class="bi bi-geo-alt"></i>
      <ng-container *ngIf="location?.district">{{ location.district }}, </ng-container>{{ location.state }}
    </div>

    <!-- PRO VIEW: Contact-visible badge -->
    <div class="inf-card__contact" *ngIf="isProViewer && !contactRestricted">
      <i class="bi bi-check-circle-fill inf-card__contact-icon"></i>
      <span>Contact details visible</span>
    </div>
  </div>
</div>
