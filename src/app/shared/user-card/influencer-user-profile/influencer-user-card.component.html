<div class="inf-card" [class.inf-card--selected]="selected">
  <!-- Image + overlays -->
  <div class="inf-card__img-wrap">
    <img [src]="displayImage" (error)="onImgError($event)" class="inf-card__img" />

    <!-- Selection checkbox (brand mode) -->
    <button
      *ngIf="selectable"
      class="inf-card__select-btn"
      [class.inf-card__select-btn--checked]="selected"
      (click)="toggleSelect.emit(); $event.stopPropagation()"
      [title]="selected ? 'Deselect' : 'Select'"
      type="button">
      <i class="bi" [class.bi-check2]="selected" [class.bi-circle]="!selected"></i>
    </button>

    <button class="inf-card__heart" (click)="$event.stopPropagation()" title="Save">
      <i class="bi bi-heart"></i>
    </button>
    <span class="inf-card__premium" *ngIf="isPremium">★ Premium</span>
  </div>

  <!-- Body -->
  <div class="inf-card__body">
    <div class="inf-card__name">{{ name }}</div>
    <div class="inf-card__category">{{ categories[0] || '—' }}</div>

    <!-- Stats row -->
    <div class="inf-card__stats">
      <div class="inf-card__stat">
        <span class="inf-card__stat-label">FOLLOWERS</span>
        <span class="inf-card__stat-value">{{ formatFollowers(socialMedia[0]?.followersCount) }}</span>
      </div>
      <div class="inf-card__stat" *ngIf="engagementRate && isProViewer">
        <span class="inf-card__stat-label">ENGAGEMENT</span>
        <span class="inf-card__stat-value inf-card__stat-value--orange">{{ engagementRate }}%</span>
      </div>
    </div>

    <!-- Contact / Pricing row -->
    <div class="inf-card__contact" *ngIf="isProViewer">
      <i class="bi bi-check-circle-fill inf-card__contact-icon"></i>
      <span>Contact details visible</span>
    </div>
    <div class="inf-card__locked" *ngIf="!isProViewer" (click)="$event.stopPropagation()" routerLink="/brand-profile">
      <i class="bi bi-lock-fill inf-card__locked-icon"></i>
      <span>Pricing hidden — upgrade to Pro</span>
    </div>

    <!-- Buttons -->
    <div class="inf-card__actions">
      <button class="inf-card__btn inf-card__btn--outline" (click)="viewProfileClick.emit()">
        View Profile
      </button>
      <button class="inf-card__btn inf-card__btn--primary" *ngIf="showCampaignBtn" (click)="createCampaignClick.emit(); $event.stopPropagation()">
        <i class="bi bi-plus-lg"></i> Campaign
      </button>
    </div>
  </div>
</div>
