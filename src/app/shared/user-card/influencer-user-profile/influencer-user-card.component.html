<div class="inf-card" [class.inf-card--selected]="selected" (click)="isProViewer && viewProfileClick.emit()">
  <!-- Image + overlays -->
  <div class="inf-card__img-wrap">
    <img [src]="displayImage" (error)="onImgError($event)" class="inf-card__img" />

    <!-- Selection checkbox (brand mode) -->
    <button
      *ngIf="selectable"
      class="inf-card__select-btn"
      [class.inf-card__select-btn--checked]="selected"
      (click)="toggleSelect.emit(); $event.stopPropagation()"
      [title]="selected ? 'Deselect' : 'Select'"
      type="button">
      <i class="bi" [class.bi-check2]="selected" [class.bi-circle]="!selected"></i>
    </button>

    <button class="inf-card__heart" (click)="$event.stopPropagation()" title="Save">
      <i class="bi bi-heart"></i>
    </button>

    <!-- PRO badge top-left -->
    <span class="inf-card__pro-badge" *ngIf="isPremium">PRO</span>
    <!-- Priority badge top-right (premium) -->
    <span class="inf-card__priority-badge" *ngIf="isPremium">⭐ Priority</span>
  </div>

  <!-- Body -->
  <div class="inf-card__body">
    <!-- Name + verified -->
    <div class="inf-card__name">
      {{ name }}
      <i class="bi bi-patch-check-fill inf-card__verified" *ngIf="isPremium" title="Verified"></i>
    </div>

    <!-- Categories -->
    <div class="inf-card__category">{{ categories.join(' · ') || '—' }}</div>

    <!-- Location -->
    <div class="inf-card__location" *ngIf="location?.state">
      <i class="bi bi-geo-alt"></i> {{ location.district }}, {{ location.state }}
    </div>

    <!-- Stats row -->
    <div class="inf-card__stats">
      <div class="inf-card__stat">
        <span class="inf-card__stat-value">{{ primaryTier || '—' }}</span>
        <span class="inf-card__stat-label">Tier</span>
      </div>
      <div class="inf-card__stat">
        <span class="inf-card__stat-value">{{ socialMedia.length }}</span>
        <span class="inf-card__stat-label">Platforms</span>
      </div>
    </div>

    <!-- Platform icons -->
    <div class="inf-card__platforms" *ngIf="socialMedia.length > 0">
      <span class="inf-card__platform-icon" *ngFor="let sm of socialMedia" [title]="sm.platform">
        <i class="bi {{ platformIcon(sm.platform) }}"></i>
      </span>
    </div>

    <!-- Pricing (visible to everyone) -->
    <div class="inf-card__pricing-row" *ngIf="promotionalPrice">
      <span class="inf-card__pricing-label">Starting from</span>
      <div class="inf-card__pricing-bottom">
        <span class="inf-card__price">₹{{ promotionalPrice | number }}</span>
        <span class="inf-card__engagement" *ngIf="isProViewer && engagementRate">{{ engagementRate }}%<br><small>engagement</small></span>
      </div>
    </div>

    <!-- PRO VIEW: Contact-visible badge -->
    <div class="inf-card__contact" *ngIf="isProViewer && !contactRestricted">
      <i class="bi bi-check-circle-fill inf-card__contact-icon"></i>
      <span>Contact details visible</span>
    </div>

    <!-- Buttons -->
    <div class="inf-card__actions">
      <button class="inf-card__btn inf-card__btn--outline" (click)="viewProfileClick.emit(); $event.stopPropagation()">
        View Profile
      </button>
      <button class="inf-card__btn inf-card__btn--primary" *ngIf="showCampaignBtn" (click)="createCampaignClick.emit(); $event.stopPropagation()">
        <i class="bi bi-plus-lg"></i> Campaign
      </button>
    </div>
  </div>
</div>
