<div
  class="photographer-card"
  [class.photographer-card--locked]="profileViewDisabled"
  [attr.aria-disabled]="profileViewDisabled"
  [title]="profileViewDisabled ? 'Upgrade to Pro to open this profile' : null"
  (click)="onViewProfileClick($event)">
  <div class="photographer-card__img-wrap">
    <img [src]="displayImage" [alt]="name" (error)="onImgError($event)" class="photographer-card__img" {{ name }} />

    <div class="photographer-card__img-tags" *ngIf="isTrendstarzVerified || isPremium || trendstarzRecommended">
      <span class="photographer-card__img-tag badge rounded-pill badge--premium" *ngIf="isPremium" tooltip="Premium" title="Premium">
        <i class="bi bi-star-fill"></i>
      </span>
      <span class="photographer-card__img-tag badge rounded-pill badge--recommended" *ngIf="trendstarzRecommended" title="TrendStarz Recommended">
        <i class="bi bi-award-fill"></i>
      </span>
    </div>
  </div>

  <div class="photographer-card__body">
    <div class="photographer-card__name">
      {{ name || '—' }}
      <span class="text-success" *ngIf="isTrendstarzVerified" tooltip="Verified" title="Verified">
        <i class="bi bi-patch-check-fill"></i>
      </span>
      
    </div>

    <div class="photographer-card__category-row">
      <div class="photographer-card__category">{{ displayCategory }}</div>
      <div class="photographer-card__welcome-price" *ngIf="showStartingPrice && startingPrice !== null" title="Automatically calculated from service rates">
        Starts from ₹{{ startingPrice | number:'1.0-0' }}
      </div>
    </div>

    <div class="photographer-card__location" *ngIf="location?.state || location?.district">
      <i class="bi bi-geo-alt"></i> {{ displayLocation }}
    </div>

    <!-- TrendScore: cards show only the positive "Campaign Ready" signal; the score
         and full readiness live on the profile page (logged-in viewers). -->
    <div class="photographer-card__score-row" *ngIf="campaignReady === 'Campaign Ready'">
      <span class="card-ready-badge"><i class="bi bi-rocket-takeoff"></i> Campaign Ready</span>
    </div>

  </div>
</div>
