<div class="photographer-card" (click)="onViewProfileClick($event)">
  <div class="photographer-card__img-wrap">
    <img [src]="displayImage" [alt]="name" (error)="onImgError($event)" class="photographer-card__img" />

    <div class="photographer-card__img-tags" *ngIf="displayTags.length">
      <span
        *ngFor="let tag of displayTags"
        class="photographer-card__img-tag badge rounded-pill"
        [ngClass]="tagBadgeClass(tag)">
        {{ tag }}
      </span>
    </div>
  </div>

  <div class="photographer-card__body">
    <div class="photographer-card__name">
      {{ name || '—' }}
      <i class="bi bi-patch-check-fill photographer-card__verified" *ngIf="isPremium" title="Verified"></i>
      <span class="photographer-card__ts-verified" *ngIf="isTrendstarzVerified">Verified by TrendStarz</span>
    </div>

    <div class="photographer-card__category-row">
      <div class="photographer-card__category">{{ displayCategory }}</div>
      <div class="photographer-card__welcome-price" *ngIf="startingPrice !== null">
        ₹{{ startingPrice | number:'1.0-0' }}
      </div>
    </div>

    <div class="photographer-card__location" *ngIf="location?.state || location?.district">
      <i class="bi bi-geo-alt"></i> {{ displayLocation }}
    </div>
  </div>
</div>
