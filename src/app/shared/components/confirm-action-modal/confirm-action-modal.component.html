<div class="modal-backdrop show" *ngIf="isOpen" (click)="dismiss()"></div>
<div class="modal d-block" *ngIf="isOpen" tabindex="-1" (click)="dismiss()">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content ts-modal confirm-action-modal" [style.width]="width">
      <div class="confirm-action-modal__header">
        <h4>{{ title }}</h4>
        <button class="confirm-action-modal__close"
                type="button"
                [disabled]="submitting"
                (click)="dismiss()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="confirm-action-modal__body">
        <ng-content></ng-content>
      </div>

      <div class="confirm-action-modal__footer">
        <button class="btn btn-outline-secondary"
                type="button"
                [disabled]="submitting"
                (click)="dismiss()">Cancel</button>
        <button class="btn btn-primary"
                type="button"
                [disabled]="submitting"
                (click)="confirmed.emit()">{{ submitting ? confirmLoadingLabel : confirmLabel }}</button>
      </div>
    </div>
  </div>
</div>
