<div class="password-modal-backdrop" *ngIf="visible" (click)="close()">
  <div class="password-modal" (click)="$event.stopPropagation()">
    <div class="password-modal__header">
      <h5>Reset Password</h5>
      <button type="button" class="password-modal__close" (click)="close()">&times;</button>
    </div>
    <div class="password-modal__body">
      <div class="alert alert-danger" *ngIf="passwordError">{{ passwordError }}</div>
      <div class="alert alert-success" *ngIf="passwordSuccess">{{ passwordSuccess }}</div>

      <div class="mb-3">
        <label class="form-label text-black">Existing Password</label>
        <div class="password-input-wrap">
          <input
            [type]="passwordVisible.current ? 'text' : 'password'"
            class="form-control"
            [(ngModel)]="passwordForm.currentPassword"
            [ngModelOptions]="{ standalone: true }"
            [disabled]="passwordSaving"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-eye-btn"
            (click)="togglePasswordVisibility('current')"
            [disabled]="passwordSaving"
            [attr.aria-label]="passwordVisible.current ? 'Hide existing password' : 'Show existing password'"
          >
            <i class="bi" [class.bi-eye]="!passwordVisible.current" [class.bi-eye-slash]="passwordVisible.current"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label text-black">New Password</label>
        <div class="password-input-wrap">
          <input
            [type]="passwordVisible.next ? 'text' : 'password'"
            class="form-control"
            [(ngModel)]="passwordForm.newPassword"
            [ngModelOptions]="{ standalone: true }"
            [disabled]="passwordSaving"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-eye-btn"
            (click)="togglePasswordVisibility('next')"
            [disabled]="passwordSaving"
            [attr.aria-label]="passwordVisible.next ? 'Hide new password' : 'Show new password'"
          >
            <i class="bi" [class.bi-eye]="!passwordVisible.next" [class.bi-eye-slash]="passwordVisible.next"></i>
          </button>
        </div>
        <ul class="pw-checklist text-black" *ngIf="passwordForm.newPassword">
          <li *ngFor="let c of passwordChecks" [class.passed]="c.passed">
            <i class="bi" [class.bi-check-circle-fill]="c.passed" [class.bi-circle]="!c.passed"></i>
            {{ c.label }}
          </li>
        </ul>
      </div>

      <div class="mb-3">
        <label class="form-label text-black">Confirm Password</label>
        <div class="password-input-wrap">
          <input
            [type]="passwordVisible.confirm ? 'text' : 'password'"
            class="form-control"
            [(ngModel)]="passwordForm.confirmPassword"
            [ngModelOptions]="{ standalone: true }"
            [disabled]="passwordSaving"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-eye-btn"
            (click)="togglePasswordVisibility('confirm')"
            [disabled]="passwordSaving"
            [attr.aria-label]="passwordVisible.confirm ? 'Hide confirm password' : 'Show confirm password'"
          >
            <i class="bi" [class.bi-eye]="!passwordVisible.confirm" [class.bi-eye-slash]="passwordVisible.confirm"></i>
          </button>
        </div>
        <div class="password-inline-error" *ngIf="confirmPasswordMismatch">
          New password and confirm password do not match.
        </div>
      </div>
    </div>

    <div class="password-modal__footer">
      <button class="btn btn-outline-secondary" type="button" (click)="close()" [disabled]="passwordSaving">Cancel</button>
      <button class="btn btn-primary" type="button" (click)="submit()" [disabled]="!canSubmit">
        {{ passwordSaving ? 'Updating...' : 'Update Password' }}
      </button>
    </div>
  </div>
</div>
