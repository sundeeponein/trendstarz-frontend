<div class="homepage-feature-toggle">
  <div class="homepage-feature-toggle__copy">
    <h3>Featured on Homepage</h3>
    <p *ngIf="isPremium && !disabled">Feature my profile on the TrendStarZ homepage to help brands and visitors discover you.</p>
    <p *ngIf="isPremium && disabled" class="homepage-feature-toggle__helper">{{ helperText }}</p>
    <p *ngIf="!isPremium" class="homepage-feature-toggle__premium-badge">⭐ Available with Premium</p>
  </div>

  <label class="homepage-feature-toggle__row" *ngIf="isPremium && !disabled">
    <span>Feature my profile on the TrendStarZ homepage</span>
    <span class="toggle">
      <input type="checkbox" [checked]="checked" [disabled]="disabled" (change)="onChange()" />
      <span class="slider"></span>
    </span>
  </label>

  <div class="homepage-feature-toggle__row homepage-feature-toggle__row--disabled" *ngIf="isPremium && disabled">
    <span>{{ helperText }}</span>
  </div>

  <div class="homepage-feature-toggle__upsell" *ngIf="!isPremium">
    <p>Upgrade to Premium to become eligible for the homepage spotlight.</p>
    <a routerLink="/upgrade-premium" class="btn btn-warning fw-bold btn-sm">Upgrade to Premium</a>
  </div>
</div>
