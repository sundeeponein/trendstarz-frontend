<div class="homepage-feature-toggle">
  <div class="homepage-feature-toggle__copy">
    <h3>Homepage Feature</h3>
    <p>Get featured on the TrendStarZ public homepage.</p>
  </div>
  <label class="homepage-feature-toggle__row">
    <span>Allow TrendStarZ to feature my profile on the homepage</span>
    <span class="toggle">
      <input type="checkbox" [checked]="checked" [disabled]="disabled" (change)="onChange()" />
      <span class="slider"></span>
    </span>
  </label>
</div>
