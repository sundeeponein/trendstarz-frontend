<section class="faq-shell" aria-label="Frequently Asked Questions">
  <header class="faq-header" *ngIf="heading || kicker || subheading">
    <p class="faq-kicker" *ngIf="kicker">{{ kicker }}</p>
    <h2 class="faq-title" *ngIf="heading">{{ heading }}</h2>
    <p class="faq-subtitle" *ngIf="subheading">{{ subheading }}</p>
  </header>

  <div class="faq-accordion">
    <div class="faq-item" *ngFor="let item of items; let i = index" [class.is-open]="activeIndex === i">
      <h3 class="faq-item-header" [id]="schemaId + '-q' + i">
        <button
          class="faq-toggle"
          type="button"
          [attr.aria-expanded]="activeIndex === i"
          [attr.aria-controls]="schemaId + '-a' + i"
          (click)="toggle(i)">
          <span class="faq-question-wrap">
            <span class="faq-question">{{ item.question }}</span>
            <span class="status-pill" *ngIf="item.label">{{ item.label }}</span>
          </span>
          <i class="bi bi-chevron-down faq-chevron" aria-hidden="true"></i>
        </button>
      </h3>
      <div
        class="faq-collapse"
        role="region"
        [id]="schemaId + '-a' + i"
        [attr.aria-labelledby]="schemaId + '-q' + i"
        [attr.aria-hidden]="activeIndex !== i">
        <div class="faq-collapse-inner">
          <p class="faq-body">{{ item.answer }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="faq-cta" *ngIf="ctaHeading || ctaButtons.length">
    <h3 *ngIf="ctaHeading">{{ ctaHeading }}</h3>
    <div class="faq-cta-buttons">
      <a
        *ngFor="let button of ctaButtons"
        [routerLink]="button.route"
        [class]="button.className || 'btn btn-outline-dark'">
        {{ button.label }}
      </a>
    </div>
  </div>
</section>
