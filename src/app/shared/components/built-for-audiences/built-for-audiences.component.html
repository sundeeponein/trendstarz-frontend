<section class="built-for-strip py-5" aria-label="Built For Audiences">
  <div class="container">
    <h2 class="built-for-title mb-1 text-center">{{ heading }}</h2>
    <p class="built-for-subtitle mb-4 text-center">{{ subheading }}</p>

    <div class="built-for-grid">
      <div class="built-for-item" *ngFor="let item of items">
        <article class="built-for-card">
          <div class="built-for-tile">
            <i class="bi" [ngClass]="item.icon"></i>
          </div>
          <h5>{{ item.title }}</h5>
          <p>{{ item.subtitle }}</p>
        </article>
      </div>
    </div>
  </div>
</section>
