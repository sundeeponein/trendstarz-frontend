<div class="smem-overlay" (click)="onOverlayClick($event)">
  <div class="smem-modal" role="dialog" aria-modal="true">
    <div class="smem-header">
      <span class="smem-platform-title">
        <i class="bi" [ngClass]="platformIcon"></i>
        {{ platformLabel }}
      </span>
      <button class="smem-close" (click)="onCancel()" type="button" aria-label="Close">&times;</button>
    </div>

    <div class="smem-body">
      <!-- Handle -->
      <div class="smem-field">
        <label class="smem-label">HANDLE</label>
        <div class="input-group input-group-sm">
          <span class="input-group-text smem-at">@</span>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="editHandle"
            placeholder="username"
            [disabled]="saving"
          />
        </div>
      </div>

      <!-- Tier -->
      <div class="smem-field">
        <label class="smem-label">TIER</label>
        <select class="form-select" [(ngModel)]="editTier" [disabled]="saving">
          <option value="">-- Select Tier --</option>
          <option *ngFor="let t of tierOptions" [value]="t.value">{{ t.label }}</option>
        </select>
      </div>

      <!-- Changed By — auto-populated from logged-in admin -->
      <div class="smem-field">
        <label class="smem-label">CHANGED BY</label>
        <div class="smem-readonly-admin">
          <i class="bi bi-person-fill smem-admin-icon"></i>
          {{ adminDisplayName }}
        </div>
      </div>

      <!-- Date -->
      <div class="smem-field">
        <label class="smem-label">DATE</label>
        <input type="text" class="form-control" [value]="todayLabel" readonly />
      </div>

      <!-- Error -->
      <div class="smem-error" *ngIf="error">{{ error }}</div>
    </div>

    <div class="smem-footer">
      <button class="btn btn-primary smem-btn-save" (click)="onSave()" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save Changes' }}
      </button>
      <button class="btn btn-outline-secondary smem-btn-cancel" (click)="onCancel()" [disabled]="saving">
        Cancel
      </button>
    </div>
  </div>
</div>
