<div class="modal-backdrop show"></div>

<div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="termsConsentTitle">
  <div class="modal-dialog modal-dialog-centered ts-dialog-md">
    <div class="modal-content ts-modal">
      <div class="ts-modal__header">
        <h5 id="termsConsentTitle">Please agree to our Terms</h5>
      </div>
      <div class="ts-modal__body">
        <p class="text-black">
          Your account was created before we started asking for this at sign-up, or our terms have been updated since.
          Please read and agree to continue using TrendStarz.
        </p>
        @if (error) {
          <div class="alert alert-danger">{{ error }}</div>
        }
        <div class="form-check my-3">
          <input class="form-check-input" type="checkbox" id="termsConsentAgree"
            [(ngModel)]="agreed" [disabled]="saving" />
          <label class="form-check-label text-black" for="termsConsentAgree">
            I agree to the <a href="/terms-and-conditions" target="_blank" rel="noopener">Terms of Service</a>
            and the <a href="/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a>.
          </label>
        </div>
      </div>
      <div class="ts-modal__footer">
        <button type="button" class="btn btn-outline-secondary" (click)="logout.emit()" [disabled]="saving">Log out</button>
        <button type="button" class="btn btn-success fw-bold" (click)="accept()" [disabled]="!agreed || saving">
          {{ saving ? 'Saving…' : 'Agree and continue' }}
        </button>
      </div>
    </div>
  </div>
</div>
