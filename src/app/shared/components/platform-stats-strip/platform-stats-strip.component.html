<section class="platform-stats-strip" aria-label="Platform milestones">
  <div class="platform-stats-strip__item" *ngFor="let item of items">
    <span class="platform-stats-strip__icon"><i class="bi" [ngClass]="item.icon"></i></span>
    <div class="platform-stats-strip__text">
      <strong class="platform-stats-strip__value">{{ item.value }}</strong>
      <span class="platform-stats-strip__label">{{ item.label }}</span>
    </div>
  </div>
</section>
