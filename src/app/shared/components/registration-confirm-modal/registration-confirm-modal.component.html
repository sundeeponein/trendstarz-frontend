<div class="rcm-overlay" *ngIf="modal.isOpen && config" (click)="onOverlayClick($event)">
  <div class="rcm-modal" role="dialog" aria-modal="true">

    <div class="rcm-header">
      <span class="rcm-title-main">Confirm Your Registration</span>
      <button class="rcm-close" (click)="modal.close()" type="button" aria-label="Close">&times;</button>
    </div>

    <div class="rcm-body">
      <div class="rcm-role-badge">{{ config.title }}</div>

      <div class="rcm-heading">
        <!-- <span class="rcm-emoji">{{ config.emoji }}</span> -->
        {{ config.heading }}
      </div>

      <p class="rcm-sub">By continuing, you confirm that:</p>

      <ul class="rcm-points">
        <li *ngFor="let point of config.points">
          <span class="rcm-check">✓</span>
          {{ point }}
        </li>
      </ul>

      <!-- <div *ngIf="config.disclaimer" class="rcm-disclaimer">
        <i class="bi bi-exclamation-triangle-fill rcm-disclaimer-icon"></i>
        {{ config.disclaimer }}
      </div> -->
    </div>

    <div class="rcm-footer">
      <button class="rcm-btn-confirm" (click)="modal.confirm()">
        {{ config.buttonLabel }}
      </button>
      <button class="rcm-btn-cancel" (click)="modal.close()">Cancel</button>
    </div>

  </div>
</div>
