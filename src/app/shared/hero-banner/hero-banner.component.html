<section class="hero-block my-3">
  <div class="container">
    <div class="row g-4 align-items-center">
      <div class="col-12 col-lg-6">
        <span class="pill-label">{{ badge }}</span>
        <h1 class="hero-title mt-3">{{ titleMain }} <span class="highlight">{{ titleHighlight }}</span> Platform</h1>
        <p class="hero-copy mt-3">{{ subtitle }}</p>
        <div class="d-flex flex-wrap gap-3 mt-4">
          <button class="btn btn-lg btn-primary" (click)="goPrimary()">{{ primaryLabel }}</button>
          <button class="btn btn-lg btn-dark" (click)="goSecondary()">{{ secondaryLabel }}</button>
          <button *ngIf="thirdLabel" class="btn btn-lg btn-text" (click)="go(thirdRoute)">{{ thirdLabel }} <i class="bi bi-arrow-right"></i></button>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="hero-media" style="background:url('imageUrl');">
          <img
            class="hero-media-bg"
            [ngSrc]="imageUrl"
            [alt]="imageAlt"
            width="1600"
            height="900"
            loading="eager"
            fetchpriority="high"
            decoding="async" style="opacity: 0;" />
          <!-- <div class="live-metric" *ngIf="liveMetricText">
            <span class="dot"></span>
            <span>{{ liveMetricText }}</span>
          </div> -->
        </div>
      </div>
    </div>
  </div>
</section>
