<div class="campaigns-page">

  <!-- Header -->
  <div class="campaigns-header">
    <div>
      <h2 class="campaigns-title">Campaigns</h2>
      <p class="campaigns-subtitle">Manage and track your influencer marketing initiatives.</p>
    </div>
    <button *ngIf="isOwner" class="btn btn-create" (click)="openCreateForm()">
      <i class="bi bi-plus-lg"></i> Create New Campaign
    </button>
  </div>

  <!-- Tab bar -->
  <div class="campaigns-tabs">
    <button
      *ngFor="let tab of visibleTabs"
      class="tab-btn"
      [class.active]="activeTab === tab.key"
      (click)="switchTab(tab.key)"
    >
      {{ tab.label }} ({{ getCount(tab.key) }})
    </button>
  </div>

  <!-- Cards grid -->
  <div class="campaigns-grid" *ngIf="pagedCampaigns.length; else emptyState">
    <app-campaign-card
      *ngFor="let c of pagedCampaigns"
      [campaign]="c"
      [limited]="limitedCards"
      [isOwner]="isOwner"
      (viewDetails)="onViewDetails($event)"
      (manage)="onManage($event)"
    ></app-campaign-card>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <i class="bi bi-megaphone"></i>
      <p>No {{ activeTab }} campaigns yet.</p>
    </div>
  </ng-template>

  <!-- Pagination -->
  <app-paginator
    [total]="filtered.length"
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    [pageSizeOptions]="pageSizeOptions"
    entityLabel="campaigns"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)">
  </app-paginator>

  <!-- Campaign Form is now a full-page flow accessible at /campaigns?create=1 -->

  <app-campaign-detail-modal
    *ngIf="!externalDetailHandling"
    [visible]="!!selectedCampaign"
    [invite]="selectedCampaignInvite"
    [showDateInput]="false"
    (close)="closeDetails()"
  ></app-campaign-detail-modal>

</div>
