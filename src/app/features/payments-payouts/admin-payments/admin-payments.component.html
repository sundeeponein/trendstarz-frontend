<div class="admin-payments-container ts-admin-page">
  <div class="payments-page-header ts-admin-page-header">
    <div class="payments-page-title ts-admin-heading">
      <h2 class="payments-title-row page-title ts-admin-title">
        <i class="bi bi-cash-coin"></i>
        <span>Premium Payments</span>
      </h2>
      <p class="ts-admin-subtitle">Manage influencer collaborations, verify proofs, and execute secure payouts from your administrative command center.</p>
    </div>

    <div class="mode-tabs ts-admin-tabbar" aria-label="Payment admin sections">
      <button class="mode-tab ts-admin-tab" [class.active]="viewMode === 'premium'" (click)="setViewMode('premium')">Premium</button>
      <button class="mode-tab ts-admin-tab" [class.active]="viewMode === 'transactions'" (click)="setViewMode('transactions')">Transactions</button>
    </div>
  </div>

  <!-- Error / Success alerts -->
  <div *ngIf="error" class="alert alert-error">
    {{ error }}
    <button class="alert-close" (click)="error = ''">×</button>
  </div>
  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
    <button class="alert-close" (click)="successMessage = ''">×</button>
  </div>

  <app-premium-payments-panel
    [hidden]="viewMode !== 'premium'"
    (errorMessage)="onError($event)"
    (successMessage)="onSuccess($event)">
  </app-premium-payments-panel>

  <app-campaign-transactions-panel
    [hidden]="viewMode !== 'transactions'"
    (errorMessage)="onError($event)"
    (successMessage)="onSuccess($event)">
  </app-campaign-transactions-panel>
</div>
