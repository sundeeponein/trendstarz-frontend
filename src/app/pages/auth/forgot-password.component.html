<div class="login-shell container-fluid p-0">
  <div class="row g-0 min-vh-100">
    <div class="col-12 col-lg-6 visual-panel d-flex flex-column">
      <div class="brand-strip d-flex align-items-center">
        <a routerLink="/"><img src="assets/logo-trendstarz-logo-text.png" alt="Trendstarz" class="brand-logo" /></a>
      </div>
      <div class="visual-copy mt-auto">
        <h1>Forgot your password?</h1>
        <p>Enter your registered email address and we'll send you a link to reset your password.</p>
        <div class="d-flex flex-wrap gap-2 mt-3">
          <span class="badge rounded-pill text-bg-light text-white">Verified Creators</span>
          <span class="badge rounded-pill text-bg-light text-white">Premium Brands</span>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-6 form-panel d-flex align-items-center justify-content-center">
      <div class="form-wrap w-100">
        <h2 class="mb-2">Forgot Password</h2>
        <p class="text-muted mb-4">Enter your email to receive a reset link.</p>
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input formControlName="email" type="email" class="form-control" placeholder="name@company.com" />
            <div *ngIf="forgotForm.get('email')?.invalid && (forgotForm.get('email')?.touched || submitted)" class="text-danger small mt-1">Valid email is required</div>
          </div>
          <button type="submit" class="btn btn-primary w-100" [disabled]="forgotForm.invalid || loading">Send Reset Link</button>
          <div *ngIf="successMsg" class="text-success text-center mt-3">{{ successMsg }}</div>
          <div *ngIf="errorMsg" class="text-danger text-center mt-3">{{ errorMsg }}</div>
        </form>
        <div class="divider my-4"><span>Remembered your password?</span></div>
        <a class="btn btn-outline-secondary w-100" routerLink="/login">Back to Login</a>
      </div>
    </div>
  </div>
</div>
