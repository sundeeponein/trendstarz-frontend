<div class="login-shell container-fluid p-0">
  <div class="row g-0 min-vh-100">
    <div class="col-12 col-lg-6 visual-panel d-flex flex-column">
      <div class="brand-strip d-flex align-items-center">
        <a routerLink="/"><img src="assets/logo-trendstarz-logo-text.png" alt="Trendstarz" class="brand-logo" /></a>
      </div>
      <div class="visual-copy mt-auto">
        <h1>Reset your password</h1>
        <p>Enter your new password below. Make sure it is strong and secure.</p>
        <div class="d-flex flex-wrap gap-2 mt-3">
          <span class="badge rounded-pill text-bg-light text-white">Verified Creators</span>
          <span class="badge rounded-pill text-bg-light text-white">Premium Brands</span>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-6 form-panel d-flex align-items-center justify-content-center">
      <div class="form-wrap w-100">
        <h2 class="mb-2">Reset Password</h2>
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <div class="password-wrap">
              <input formControlName="password" [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Enter new password" />
              <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
              </button>
            </div>
            <ul class="pw-checklist text-black" *ngIf="resetForm.get('password')?.value || resetForm.get('password')?.touched">
              <li *ngFor="let c of passwordChecks" [class.passed]="c.passed">
                <i class="bi" [class.bi-check-circle-fill]="c.passed" [class.bi-circle]="!c.passed"></i>
                {{ c.label }}
              </li>
            </ul>
            <div *ngIf="resetForm.get('password')?.invalid && (resetForm.get('password')?.touched || submitted)" class="text-danger small mt-1">Please create a valid password.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <div class="password-wrap">
              <input formControlName="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'" class="form-control" placeholder="Confirm new password" />
              <button type="button" class="password-toggle" (click)="toggleConfirmPasswordVisibility()" [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
                <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
              </button>
            </div>
            <div *ngIf="resetForm.hasError('mismatch') && (resetForm.get('confirmPassword')?.touched || submitted)" class="text-danger small mt-1">Passwords do not match</div>
          </div>
          <button type="submit" class="btn btn-primary w-100" [disabled]="resetForm.invalid || loading">Reset Password</button>
          <div *ngIf="successMsg" class="text-success text-center mt-3">{{ successMsg }}</div>
          <div *ngIf="errorMsg" class="text-danger text-center mt-3">{{ errorMsg }}</div>
        </form>
        <div class="divider my-4"><span>Back to login?</span></div>
        <a class="btn btn-outline-secondary w-100" routerLink="/login">Login</a>
      </div>
    </div>
  </div>
</div>
