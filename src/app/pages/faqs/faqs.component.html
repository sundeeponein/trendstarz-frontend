<section class="faqs-page py-5">
  <div class="container py-4">
    <div class="faqs-hero text-center mb-4">
      <p class="eyebrow mb-2">Got questions?</p>
      <h1 class="page-title mb-3">Frequently Asked Questions</h1>
      <p class="page-subtitle mb-0">
        Everything you need to know about working with creators and hiring through TrendStarz.
      </p>
    </div>

    <div class="search-wrap mb-4">
      <div class="faq-search-box">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input
          id="faqSearch"
          type="search"
          class="faq-search"
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchChange($event)"
          placeholder="Search questions, e.g. payments, verification"
          aria-label="Search FAQs" />
      </div>
      <div class="search-meta mt-2">
        Showing {{ filteredFaqs().length }} of {{ allFaqs.length }} questions
      </div>
    </div>

    <ng-container *ngIf="filteredFaqs().length > 0; else noResults">
      <app-faq-accordion
        [heading]="''"
        [items]="filteredFaqs()"
        [schemaItems]="allFaqs"
        [showSchema]="true"
        [schemaId]="'trendstarz-faq-page-schema'"
        [ctaButtons]="ctaButtons">
      </app-faq-accordion>
    </ng-container>

    <ng-template #noResults>
      <div class="no-results text-center">
        <h3>No FAQs matched your search.</h3>
        <p>Try a different keyword or clear the search box.</p>
      </div>
    </ng-template>
  </div>
</section>
