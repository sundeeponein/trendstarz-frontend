<div class="home-shell rounded-3 shadow-sm">
  <app-hero-banner
    [primaryLabel]="isLoggedIn() ? 'Start a Campaign' : 'Register as Brand'"
    [primaryRoute]="isLoggedIn() ? '/campaigns' : ''"
    [secondaryLabel]="isLoggedIn() ? 'Find Creators' : 'Register as Influencer'"
    [secondaryRoute]="isLoggedIn() ? '/search' : ''"
    [thirdLabel]="'Explore Features'"
    [thirdRoute]="'/features'"
    liveMetricText="Live: 5,400+ Campaigns active now"
    imageUrl="assets/banner-trendstarz-1600.jpg"
    (primaryClick)="isLoggedIn() ? null : regConfirm.open('brand')"
    (secondaryClick)="isLoggedIn() ? null : regConfirm.open('influencer')"
  ></app-hero-banner>
  <app-registration-confirm-modal></app-registration-confirm-modal>

  <!-- <ng-container
    [ngComponentOutlet]="heroSliderBannerComponent"
    [ngComponentOutletInputs]="heroSliderBannerInputs">
  </ng-container> -->

  <ng-container
    [ngComponentOutlet]="builtForAudiencesComponent"
    [ngComponentOutletInputs]="builtForAudiencesInputs"
  ></ng-container>

  <section class="brands-strip py-5" aria-label="Brands Grid" *ngIf="isMarketplaceReadyForPublic">
    <div class="container">
      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <h2 class="section-title mb-1">Featured Brands</h2>
          <p class="section-subtitle">Discover top companies actively hiring creators</p>
        </div>
        <button class="btn btn-link view-all" (click)="regConfirm.open('brand')" type="button">View all brands</button>
      </div>

      <div *ngIf="brandsLoading && brands.length === 0" class="text-center text-muted">Loading brands...</div>

      <div class="row g-3" *ngIf="brands.length > 0">
        <div class="col-12 col-sm-6 col-lg-3" *ngFor="let brand of brands | slice:0:8">
          <app-brand-user-card
            class="welcome-card-host"
            [brandLogo]="brand.brandLogo"
            [brandName]="brand.brandName || ''"
            [categories]="brand.categories || []"
            [isPremium]="brand.isPremium || false"
            [verifiedByTrendStarz]="brand.verifiedByTrendStarz || false"
            [adminTags]="[]"
            [location]="{ state: brand.location?.state || '' }"
            [showWelcomeCampaignMeta]="showBrandCampaignMetaOnWelcome"
            [welcomeCampaignStatus]="getWelcomeBrandCampaignStatus(brand)"
            (viewProfileClick)="viewBrandProfile(brand)">
          </app-brand-user-card>
        </div>
      </div>
    </div>
  </section>

  <section class="creators-strip py-5" aria-label="Influencers Grid" *ngIf="isMarketplaceReadyForPublic">
    <div class="container">
      <h2 class="section-title text-white mb-1">Trending Creators</h2>
      <div class="chip-row mb-4">
        <span class="chip" [class.active]="!selectedCategory" (click)="filterByCategory('')">All Categories</span>
        <span class="chip" *ngFor="let cat of creatorCategories" [class.active]="selectedCategory === cat" (click)="filterByCategory(cat)">{{ cat }}</span>
      </div>

      <div *ngIf="influencersLoading && influencers.length === 0" class="text-center text-white-50">Loading influencers...</div>

      <div class="row g-3" *ngIf="influencers.length > 0">
        <div class="col-12 col-md-6 col-lg-3" *ngFor="let influencer of influencers | slice:0:6">
          <app-influencer-user-card
            class="welcome-card-host"
            [profileImage]="influencer.profileImage || influencer.profileImages?.[0]?.url || ''"
            [name]="influencer.name || influencer.fullname || ''"
            [influencerCategory]="influencer.influencerCategory || influencer.categories?.[0] || ''"
            [creatorTypes]="influencer.creatorTypes || []"
            [professionalStatus]="!!influencer.professionalStatus"
            [isPremium]="influencer.isPremium || false"
            [promotionalPrice]="influencer.promotionalPrice"
            [showWelcomeStartingPrice]="true"
            [verificationStatus]="influencer.verificationStatus || 'not_submitted'"
            [verifiedByTrendStarz]="influencer.verifiedByTrendStarz || false"
            [location]="{ state: influencer.location?.state || '' }"
            [socialMedia]="[]"
            [adminTags]="[]"
            (viewProfileClick)="viewInfluencerProfile(influencer)">
          </app-influencer-user-card>
        </div>
      </div>
    </div>
  </section>

  <app-why-trendstarz-glance *ngIf="!isMarketplaceReadyForPublic" [categories]="homepageCategories" [counters]="glanceCounters"></app-why-trendstarz-glance>

  <section class="demo-campaigns-strip py-5" aria-label="Featured Campaign Examples" *ngIf="!isMarketplaceReadyForPublic">
    <div class="container py-4">
      <h2 class="text-center text-white mb-5">Featured Campaign Examples</h2>
      <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" *ngFor="let campaign of featuredCampaignExamples; let i = index">
          <article class="example-item h-100" [ngClass]="'accent-' + (i % 3)">
            <h5>{{ campaign.title }}</h5>
            <p>{{ campaign.summary }}</p>
            <span>{{ campaign.focus }}</span>
          </article>
        </div>
      </div>
    </div>
  </section>

  <section class="brand-cta-strip py-5" aria-label="Brand registration">
    <div class="container py-4">
      <app-action-cta
        heading="Ready to hire the right creative talent?"
        description="Register as a Brand to hire Influencers and Photo/Videographers for campaigns that move your business forward."
        buttonLabel="Register as a Brand"
        buttonRoute="/register-brand"
        ariaLabel="Register as a Brand"
        (buttonClick)="regConfirm.open('brand')">
      </app-action-cta>
    </div>
  </section>

  <section class="faq-strip py-5" aria-label="Frequently Asked Questions">
    <div class="container py-4">
      <ng-container
        [ngComponentOutlet]="faqAccordionComponent"
        [ngComponentOutletInputs]="faqAccordionInputs">
      </ng-container>
    </div>
  </section>
</div>
